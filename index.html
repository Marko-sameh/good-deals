<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Deals — Your business, switched on.</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070F1E;--s:#212B4C;--n:#E2E8F0;--m:#9AA6BF;--a:#BFF747;--card:#111B31;--surf:#0B1528;--bd:#E2E8F01a;--inp:#E2E8F026;--glow:0 0 60px -10px #BFF7478c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--n);font-family:"Plus Jakarta Sans","Somar Sans",Cairo,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[dir=rtl] body,html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:"Somar Sans",Cairo,sans-serif}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
h1,h2,h3{font-family:"Plus Jakarta Sans","Somar Sans",Cairo,sans-serif;letter-spacing:-.01em}
.w{max-width:1200px;margin-inline:auto;padding-inline:24px}
.cyber{background-image:linear-gradient(var(--bd) .5px,transparent .5px),linear-gradient(90deg,var(--bd) .5px,transparent .5px);background-size:64px 64px}
.glass{background:#111B31b3;backdrop-filter:blur(16px);border:1px solid var(--bd)}
/* loader */
#ld{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:transform .9s cubic-bezier(.7,0,.2,1)}
#ld.go{transform:translateY(-100%)}
#ld .bar{height:1px;width:190px;background:var(--bd);overflow:hidden}
#ld .bar i{display:block;height:100%;width:0;background:var(--a);transition:width 1.4s cubic-bezier(.22,1,.36,1)}
/* cursor */
#cur{position:fixed;left:-100px;top:-100px;width:12px;height:12px;border-radius:50%;background:var(--a);pointer-events:none;z-index:110;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .3s,height .3s;display:none}
@media(hover:hover) and (min-width:900px){#cur{display:block}}
/* nav */
nav{position:fixed;inset-inline:0;top:0;z-index:60;padding:22px 0;transition:padding .4s,background .4s,backdrop-filter .4s}
nav.st{padding:12px 0;background:#070F1Ef8;backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.04em}
.lg svg{height:30px;width:auto}
nav ul{display:flex;gap:26px;list-style:none;font-size:14px;color:var(--m)}
nav ul a:hover,nav ul a.on{color:var(--a)}
.r{display:flex;align-items:center;gap:10px}
.lb{border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800;transition:.3s}
.lb:hover{border-color:var(--a);color:var(--a)}
.btn{background:var(--a);color:var(--bg);padding:14px 26px;border-radius:99px;font-weight:800;display:inline-flex;align-items:center;gap:8px;border:0;transition:.3s}
.btn:hover{box-shadow:var(--glow)}
.ghost{border:1px solid var(--bd);border-radius:99px;padding:14px 26px;font-weight:800;transition:.3s;display:inline-flex;gap:8px;align-items:center}
.ghost:hover{border-color:var(--a);color:var(--a)}
#mb{display:none;font-size:22px}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;padding:130px 0 70px}
.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hero .fade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),#070F1E99 55%,#070F1E55)}
.hero .gl{position:absolute;inset-inline-end:-10%;top:22%;height:480px;width:480px;border-radius:50%;background:var(--a);filter:blur(160px);opacity:.12;transition:opacity 1.2s}
.hero .gl.on{opacity:.25}
.hero .w{position:relative;z-index:3;display:grid;gap:56px;align-items:center;width:100%}
@media(min-width:1000px){.hero .w{grid-template-columns:1.3fr 1fr}}
.tag{color:var(--a);font-size:12px;letter-spacing:.3em;font-weight:800}
h1{font-size:clamp(42px,7.4vw,104px);line-height:1.03;font-weight:800}
h1 em{color:var(--a);font-style:normal}
.sub{max-width:560px;margin-top:28px;color:var(--m);font-size:18px;line-height:1.7}
.cta{margin-top:38px;display:flex;flex-wrap:wrap;gap:14px}
.sw{border-radius:26px;padding:24px}
.sw .top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surf);border-radius:18px;padding:18px;margin-bottom:16px;width:100%}
.sw .top svg{height:34px;width:auto}
.tg{position:relative;height:36px;width:64px;border-radius:99px;background:var(--s);transition:background .5s}
.tg.on{background:var(--a);box-shadow:var(--glow)}
.tg i{position:absolute;top:4px;inset-inline-start:4px;height:28px;width:28px;border-radius:50%;background:var(--n);transition:inset-inline-start .4s cubic-bezier(.22,1,.36,1)}
.tg.on i{inset-inline-start:32px}
.st-r{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--bd);border-radius:14px;padding:13px 16px;font-size:14px;margin-bottom:10px}
.st-r span:last-child{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--m);transition:color .5s}
.st-r.on span:last-child{color:var(--a)}
.dot{height:8px;width:8px;border-radius:50%;background:var(--m)}
.st-r.on .dot{background:var(--a);animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.35}}
.scrl{position:absolute;bottom:26px;inset-inline-start:50%;height:48px;width:1px;background:var(--bd);overflow:hidden;z-index:3}
.scrl i{display:block;height:100%;background:var(--a);animation:sq 2s infinite}
@keyframes sq{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* marquee */
.mq{border-block:1px solid var(--bd);background:var(--surf);padding:22px 0;overflow:hidden;direction:ltr}
.mq div{display:flex;gap:56px;width:max-content;animation:mq 30s linear infinite;font-size:clamp(26px,4vw,46px);font-weight:800;color:#E2E8F059;white-space:nowrap}
.mq i{color:var(--a);font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
/* sections */
section{padding:96px 0}
h2{font-size:clamp(30px,4.6vw,62px);font-weight:800;line-height:1.12}
.lead{margin-top:18px;color:var(--m);font-size:18px;max-width:640px;line-height:1.7}

.trust{text-align:center}
.trust .bg{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:32px}
.trust b{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:12px 20px;font-size:13px;font-weight:800;color:var(--m);transition:.35s}
.trust b:hover{border-color:var(--a);color:var(--a);box-shadow:var(--glow)}
.trust b svg{height:15px;width:15px;opacity:.6}
/* cards */
.g{display:grid;gap:18px;grid-template-columns:repeat(3,1fr);margin-top:56px}
.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.c{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:30px;transition:.45s;display:block;height:100%}
.c:hover{transform:translateY(-6px);border-color:#BFF74799;box-shadow:var(--glow)}
.c small{color:var(--a);font-weight:800;font-size:13px}
.c h3{font-size:20px;margin:16px 0 10px}
.c p{color:var(--m);font-size:14px;line-height:1.7}
/* rows */
.row{display:grid;grid-template-columns:110px 1fr 1fr;gap:24px;align-items:center;border-top:1px solid var(--bd);padding:38px 0;transition:.4s}
.row:hover{background:#0B152866}
.row b{font-size:44px;font-weight:800;color:#BFF74766;transition:.4s}
.row:hover b{color:var(--a)}
.row h3{font-size:clamp(24px,3.2vw,40px);font-weight:800;transition:.4s}
.row:hover h3{color:var(--a);transform:translateX(12px)}

.row p{color:var(--m);line-height:1.7}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.stats b{display:block;font-size:clamp(44px,6vw,72px);font-weight:800;color:var(--a)}
.stats p{color:var(--m);font-size:14px;margin-top:6px}

.hz{height:300vh;position:relative}
.hz .st{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;direction:ltr;padding-top:110px;box-sizing:border-box}
.tr{display:flex;gap:24px;padding-inline:24px;will-change:transform}
.pj{position:relative;flex:0 0 min(560px,82vw);height:56vh;border-radius:26px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}
.pj .gr{position:absolute;inset:0;opacity:.6;transition:transform .7s}
.pj:hover .gr{transform:scale(1.1)}
.pj .mock{position:absolute;inset:32px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--s),var(--surf));padding:22px}
.pj .mock u{display:block;height:10px;width:50%;border-radius:9px;background:#BFF747b3;text-decoration:none}
.pj .mock s{display:block;height:7px;border-radius:9px;background:#9AA6BF4d;text-decoration:none;margin-top:10px}
.pj .mock .b{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.pj .mock .b i{height:60px;border-radius:10px;background:var(--s)}
.pj .cap{position:absolute;inset-inline:0;bottom:0;padding:28px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(to top,var(--bg),transparent)}
.pj .cap span{color:var(--a);font-size:12px;font-weight:800;letter-spacing:.14em}
.pj .cap h3{font-size:26px;margin-top:4px}
.pj .go{height:46px;width:46px;border-radius:50%;background:var(--a);color:var(--bg);display:grid;place-items:center;transition:transform .4s}
.pj:hover .go{transform:rotate(45deg)}
/* process */
.pr{position:relative;margin-top:64px;padding-inline-start:44px}
.pr .line{position:absolute;inset-inline-start:7px;top:0;height:100%;width:1px;background:var(--bd)}
.pr .line i{display:block;width:100%;height:0;background:var(--a);box-shadow:var(--glow)}
.step{position:relative;margin-bottom:64px}
.step:last-child{margin-bottom:0}
.step .knob{position:absolute;inset-inline-start:-44px;top:8px;height:15px;width:15px;border-radius:50%;border:2px solid var(--a);background:var(--bg)}
.step small{color:var(--a);font-weight:800;font-size:13px;letter-spacing:.1em}
.step h3{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin-top:8px}
.step p{color:var(--m);margin-top:10px;max-width:420px;line-height:1.7}
/* quotes */
.qt{background:var(--surf);text-align:center}
.qbox{min-height:210px;display:grid;place-items:center;margin-top:34px}
.qbox p{font-size:clamp(22px,3vw,36px);font-weight:700;line-height:1.4;max-width:820px;transition:.6s}
.qbox small{display:block;color:var(--m);font-size:14px;margin-top:22px;font-weight:600}
.qbox.out{opacity:0;transform:translateY(-20px)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:26px}
.dots button{height:6px;width:16px;border-radius:99px;background:var(--bd);transition:.3s}
.dots button.on{width:40px;background:var(--a)}
/* reels */
.rl{display:grid;gap:18px;grid-template-columns:repeat(3,1fr);margin-top:52px}
.rlc{position:relative;aspect-ratio:9/12;border-radius:22px;overflow:hidden;border:1px solid var(--bd);display:block;width:100%}
.rlc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:.7s}
.rlc:hover video{opacity:.9;transform:scale(1.08)}
.rlc .pl{position:absolute;inset:0;display:grid;place-items:center}
.rlc .pl i{height:60px;width:60px;border-radius:50%;background:var(--a);color:var(--bg);display:grid;place-items:center;box-shadow:var(--glow)}
.rlc h3{position:absolute;bottom:20px;inset-inline-start:20px;font-size:18px}
/* modal */
#md{position:fixed;inset:0;z-index:100;background:#070F1Ef2;backdrop-filter:blur(10px);display:none;place-items:center;padding:24px}
#md.op{display:grid}
#md .in{position:relative;width:100%;max-width:900px;border-radius:22px;overflow:hidden;border:1px solid var(--bd)}
#md video{width:100%;display:block}
#md .x{position:absolute;top:12px;inset-inline-end:12px;height:38px;width:38px;border-radius:50%;background:#070F1Ecc;display:grid;place-items:center}

.pl-m{border-block:1px solid var(--bd);background:var(--surf);padding:26px 0;overflow:hidden;direction:ltr}

.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);border-radius:22px;overflow:hidden;margin-top:56px}
.pg div{background:var(--bg);padding:52px 18px;text-align:center;font-weight:800;font-size:19px;color:var(--m);transition:.4s}
.pg div:hover{background:var(--a);color:var(--bg)}
/* form */
form{display:grid;gap:14px}
input,textarea{background:var(--surf);border:1px solid var(--inp);border-radius:14px;padding:16px;color:var(--n);outline:none;transition:.3s;width:100%}
input:focus,textarea:focus{border-color:var(--a)}
.sent{padding:60px 0;text-align:center;font-size:22px;font-weight:800;color:var(--a)}
/* hub chat */
#hub{position:fixed;bottom:22px;inset-inline-end:22px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#hub .pn{width:250px;border-radius:20px;padding:16px;display:none;box-shadow:var(--glow)}

#hub .pn a:hover{border-color:var(--a);color:var(--a)}

#hub .bb{height:54px;width:54px;border-radius:50%;background:var(--a);color:var(--bg);display:grid;place-items:center;box-shadow:var(--glow);transition:transform .3s}

/* misc */
.rv{opacity:0;transform:translateY(42px);transition:1s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.wd{display:inline-block;overflow:hidden;padding-bottom:.12em;vertical-align:bottom}
.wd i{display:inline-block;font-style:normal;transform:translateY(110%);transition:transform 1s cubic-bezier(.22,1,.36,1)}
.wd.in i{transform:none}
.ph{padding:180px 0 76px;position:relative;overflow:hidden}
.ph .gl{position:absolute;inset-inline-end:-8%;top:0;height:380px;width:380px;border-radius:50%;background:var(--a);filter:blur(160px);opacity:.18}
.art{max-width:720px;font-size:18px;line-height:1.9;color:#CFD6E3}
.art p{margin-bottom:24px}
.ctab{text-align:center;border-top:1px solid var(--bd);padding:110px 0}
footer{border-top:1px solid var(--bd);background:var(--surf);padding:56px 0 0}
footer .w{display:grid;gap:34px;grid-template-columns:1.2fr 1fr 1fr 1fr}
footer .tg2{color:var(--m);font-size:11px;letter-spacing:.25em;margin-top:14px}
footer ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--m)}
footer ul a:hover{color:var(--a)}
footer .ct{font-size:14px;color:var(--m);display:flex;flex-direction:column;gap:11px}
footer .ct span{display:flex;align-items:center;gap:9px}
footer .ct svg{height:15px;width:15px;color:var(--a);flex:none}
footer .soc{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--m)}
footer .soc a:hover{color:var(--a)}
footer .cp{border-top:1px solid var(--bd);margin-top:44px;padding:22px 0;text-align:center;font-size:12px;color:var(--m)}
@media(max-width:1000px){nav ul{display:none;position:absolute;top:100%;inset-inline:0;background:#070F1E;border-bottom:1px solid var(--bd);box-shadow:0 30px 60px -20px #000c;flex-direction:column;padding:26px 24px 30px;gap:16px;font-size:19px;min-height:calc(100vh - 62px);max-height:calc(100vh - 62px);overflow:auto}nav ul.op{display:flex}#mb{display:block}.g,.g4,.pg{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr;gap:10px}.rl{grid-template-columns:1fr}.hz{height:190vh}.hz .st{justify-content:flex-start;padding-top:104px;gap:26px}.pj{height:52vh}.hero{padding-bottom:120px}#hub .bb{height:46px;width:46px}#hub .pn{width:220px}footer .w{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g,.g2,.g4,.pg,.stats{grid-template-columns:1fr}footer .w{grid-template-columns:1fr}.hide{display:none}}
</style></head><body>

post:(c,id)=>{const p=c.posts.find(x=>x.id==id)||c.posts[0];const g=p.k=="news"?(L=="ar"?"الشركة":"Company"):(L=="ar"?"رؤى":"Insights");return ph(p.d+" · "+g,p.t,p.e)+`<section style="padding-top:0"><div class="w art">${p.b.map(b=>`<p class="rv">${b}</p>`).join("")}<a class="btn" href="#/${p.k}">${c.back}</a></div></section>`}
};
function words(h,delay){
 const d=document.createElement("div");d.innerHTML=h.innerHTML;let i=0;
 const wrap=n=>[...n.childNodes].forEach(k=>{
  if(k.nodeType==3){const f=document.createDocumentFragment();
   k.textContent.split(/(\s+)/).forEach(tk=>{
    if(!tk)return;
    if(/^\s+$/.test(tk)){f.appendChild(document.createTextNode(" "));return}
    const s=document.createElement("span");s.className="wd";const it=document.createElement("i");it.textContent=tk;it.style.transitionDelay=(delay+i*0.08+(started?0:0.9))+"s";s.appendChild(it);f.appendChild(s);i++});
   k.replaceWith(f)}else wrap(k)});
 wrap(d);h.innerHTML=d.innerHTML;
 requestAnimationFrame(()=>setTimeout(()=>h.querySelectorAll(".wd").forEach(e=>e.classList.add("in")),started?60:1500));
}
function counters(root){
 root.querySelectorAll("[data-n]").forEach(b=>{
  const n=+b.dataset.n;let t=0;const s=setInterval(()=>{t++;b.textContent=Math.round(n*t/45);if(t>=45)clearInterval(s)},28)});
}
function render(){
 const c=T[L],[r,id]=location.hash.replace(/^#\/?/,"").split("/");
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 $("nlg").innerHTML=MARK+"<span>GOOD DEALS</span>";$("flg").innerHTML=MARK+"<span>GOOD DEALS</span>";
 $("nl").innerHTML=c.nav.map(n=>`<li><a href="#/${n[0]}" class="${r==n[0]?"on":""}">${n[1]}</a></li>`).join("");
 $("nl").classList.remove("op");$("mb").textContent="☰";$("hub").style.display="flex";
 $("lb").textContent=c.lang;$("nc").textContent=c.cta;$("ftg").textContent=c.tagline;
 $("fnl").innerHTML=c.nav.map(n=>`<li><a href="#/${n[0]}">${n[1]}</a></li>`).join("");
 $("fct").innerHTML=`<span>${IC.pin} Abu Dhabi, UAE • Cairo, Egypt</span><span dir="ltr">${IC.tel} +971 50 317 2004</span><a href="mailto:info@gooddeals.ae" style="display:flex;gap:9px;align-items:center">${IC.mail} info@gooddeals.ae</a>`;
 $("fsoc").innerHTML=["LinkedIn","Instagram","X","Behance"].map(s=>`<a href="#">${s}</a>`).join("");
 $("fcp").textContent=`© 2026 Good Deals. ${c.rights}`;
 $("app").innerHTML=(P[r]||P[""])(c,id);
 document.title=(r&&r!=""?((r=="post"?(c.posts.find(x=>x.id==id)||{}).t||"Article":(c.nav.find(n=>n[0]==r)||["","Good Deals"])[1])+" — Good Deals"):"Good Deals — Your business, switched on.");
 scrollTo(0,0);
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");if(e.target.matches("[data-n]")||e.target.querySelector("[data-n]"))counters(e.target);io.unobserve(e.target)}),{threshold:.15});
 document.querySelectorAll(".rv").forEach(e=>io.observe(e));
 document.querySelectorAll(".split").forEach(h=>words(h,0));
 // hero switch
 const swt=$("swt"),swb=$("swb");
 if(swt){let on=false;const apply=()=>{swt.classList.toggle("on",on);$("hgl").classList.toggle("on",on);document.querySelectorAll("[data-st]").forEach((row,i)=>{row.classList.toggle("on",on);row.querySelector(".lbl").textContent=on?c.status[i][1]:"OFF"})};swb.onclick=()=>{on=!on;apply()};setTimeout(()=>{on=true;apply()},1600);}
 // quotes
 clearInterval(qTimer);
 const qb=$("qbox");
 if(qb){let k=0;const go=n=>{k=n;qb.classList.add("out");setTimeout(()=>{qb.innerHTML=`<div><p class="q">“${c.qs[k][0]}”</p><small>${c.qs[k][1]}</small></div>`;qb.classList.remove("out")},450);document.querySelectorAll("[data-q]").forEach((b,i)=>b.classList.toggle("on",i==k))};
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>go(+b.dataset.q));
  qTimer=setInterval(()=>go((k+1)%c.qs.length),5000);}
 // reels modal
 document.querySelectorAll("[data-reel]").forEach(b=>b.onclick=()=>{$("mdv").src=VIDEO;$("md").classList.add("op")});
 // hub panel
 $("hpn").innerHTML=`<p>${c.hubsTitle}</p>`+c.hubs.map(h=>`<a href="https://wa.me/${h[2]}" target="_blank" rel="noreferrer"><span>${h[0]}</span><s>${h[1]}</s></a>`).join("");
}
$("lb").onclick=()=>{L=L=="en"?"ar":"en";localStorage.setItem("gd-lang",L);render()};
$("mb").onclick=()=>{const o=$("nl").classList.toggle("op");$("mb").textContent=o?"✕":"☰";$("hub").style.display=o?"none":"flex"};
$("mdx").onclick=$("md").onclick=()=>{$("md").classList.remove("op");$("mdv").pause();$("mdv").src=""};
$("hbb").onclick=()=>{$("hpn").classList.toggle("op");$("hbb").textContent=$("hpn").classList.contains("op")?"✕":"💬"};
addEventListener("hashchange",render);
addEventListener("scroll",()=>{
 $("nv").classList.toggle("st",scrollY>40);
 const hz=document.querySelector(".hz"),tr=$("tr");
 if(hz&&tr){const p=Math.min(1,Math.max(0,-hz.getBoundingClientRect().top/(hz.offsetHeight-innerHeight)));
  tr.style.transform=`translateX(${-p*(tr.scrollWidth-innerWidth+48)}px)`}
 const hv=$("hv");if(hv){const p=Math.min(1,scrollY/innerHeight);hv.style.transform=`translateY(${p*120}px) scale(${1+p*0.18})`}
 const pr=$("pr"),prf=$("prf");
 if(pr&&prf){const r=pr.getBoundingClientRect();const p=Math.min(1,Math.max(0,(innerHeight*0.75-r.top)/(r.height*0.85)));prf.style.height=(p*100)+"%"}
},{passive:true});
addEventListener("mousemove",e=>{const cu=$("cur");cu.style.left=e.clientX+"px";cu.style.top=e.clientY+"px";const big=!!(e.target.closest&&e.target.closest("a,button,[data-hover]"));cu.style.width=big?"52px":"12px";cu.style.height=big?"52px":"12px"});
$("ldl").innerHTML=MARK+"<span style='font-size:22px'>GOOD DEALS</span>";
render();
requestAnimationFrame(()=>$("ldb").style.width="100%");
setTimeout(()=>{$("ld").classList.add("go");started=true},1700);
import("https://esm.sh/lenis@1.1.18").then(({default:Lenis})=>{const l=new Lenis({lerp:0.09});const loop=t=>{l.raf(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}).catch(()=>{});
</script></body></html>
